<template>
    <div class="slds-card slds-p-around_medium">
        <!-- Event Details -->
        <template if:true={showLocation}>
            <div class="slds-m-bottom_medium">
                <h4 class="slds-text-heading_medium slds-p-vertical_xx-small">Event Details</h4>
                <template if:true={locationTitle}>
                    <p>{locationTitle}</p>
                </template>
                <template if:true={formattedLocationDate}>
                    <p>{formattedLocationDate}</p>
                </template>
                <template if:true={locationAddress}>
                    <template if:true={locationMapLink}>
                        <p><a href={locationMapLink} target="_blank" rel="noopener noreferrer">{locationAddress}</a></p>
                    </template>
                    <template if:false={locationMapLink}>
                        <p>{locationAddress}</p>
                    </template>
                </template>
            </div>
        </template>

        <!-- Event Cost -->
        <template if:true={showEventCost}>
            <div class="slds-m-bottom_medium">
                <h3 class="slds-text-heading_medium">{eventCostLabel}</h3>
                <p class="slds-text-body">${baseEventCost}</p>
            </div>
        </template>

        <!-- Third Party Registrant -->
        <template if:true={showThirdPartyRegistrant}>
            <div class="slds-m-bottom_medium">
                <lightning-combobox
                    label={thirdPartyRegistrantLabel}
                    value={thirdPartyStatus}
                    options={thirdPartyOptions}
                    required
                    onchange={handleThirdPartyChange}>
                </lightning-combobox>
            </div>

            <template if:true={showParentInfo}>
                <h3 class="slds-text-heading_medium slds-m-bottom_small">My Information</h3>
                <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            label={parentFirstNameLabel}
                            value={registration.Registrant_Parent_First_Name__c}
                            data-field="Registrant_Parent_First_Name__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            label={parentLastNameLabel}
                            value={registration.Registrant_Parent_Last_Name__c}
                            data-field="Registrant_Parent_Last_Name__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            type="email"
                            label={parentEmailLabel}
                            value={registration.Registrant_Parent_Email__c}
                            data-field="Registrant_Parent_Email__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            type="tel"
                            label={parentPhoneLabel}
                            value={registration.Registrant_Parent_Phone__c}
                            data-field="Registrant_Parent_Phone__c"
                            onchange={handleInputChange}
                            onblur={handlePhoneBlur}>
                        </lightning-input>
                    </div>
                </div>
            </template>

            <template if:true={showOtherInfo}>
                <h3 class="slds-text-heading_medium slds-m-bottom_small">My Information</h3>
                <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            label={firstNameLabel}
                            value={registration.Registrant_Other_First_Name__c}
                            data-field="Registrant_Other_First_Name__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            label={lastNameLabel}
                            value={registration.Registrant_Other_Last_Name__c}
                            data-field="Registrant_Other_Last_Name__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            type="email"
                            label={emailLabel}
                            value={registration.Registrant_Other_Email__c}
                            data-field="Registrant_Other_Email__c"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-input
                            type="tel"
                            label={phoneLabel}
                            value={registration.Registrant_Other_Phone__c}
                            data-field="Registrant_Other_Phone__c"
                            onchange={handleInputChange}
                            onblur={handlePhoneBlur}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-textarea
                            label={relationshipLabel}
                            value={registration.Registrant_Other_Relationship__c}
                            data-field="Registrant_Other_Relationship__c"
                            onchange={handleInputChange}>
                        </lightning-textarea>
                    </div>
                </div>
            </template>

            <template if:true={showThirdPartyDetails}>
                <p class="slds-m-bottom_medium">
                    Enter the contact information of the individual you are registering for this activity below.
                    <br/>
                    <strong><em>Note: it is preferable that the registrant have a unique email (different than yours) for our records.</em></strong>
                </p>
            </template>
        </template>

        <!-- Basic Information -->
        <template if:true={showRegistrantInfoHeading}>
            <h3 class="slds-text-heading_medium slds-m-bottom_small">Registrant Information</h3>
        </template>
        <div class="slds-grid slds-gutters slds-wrap">
            <!-- First Name -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    label={firstNameLabel}
                    value={registration.Registrant_First_Name__c}
                    data-field="Registrant_First_Name__c"
                    onchange={handleInputChange}
                    required>
                </lightning-input>
            </div>

            <!-- Last Name -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    label={lastNameLabel}
                    value={registration.Registrant_Last_Name__c}
                    data-field="Registrant_Last_Name__c"
                    onchange={handleInputChange}
                    required>
                </lightning-input>
            </div>

            <!-- Email -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    type="email"
                    label={emailLabel}
                    value={registration.Registrant_Email__c}
                    data-field="Registrant_Email__c"
                    onchange={handleInputChange}
                    required>
                </lightning-input>
            </div>

            <!-- Preferred First Name -->
            <template if:true={showPreferredName}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label={preferredNameLabel}
                        value={registration.Registrant_Preferred_First_Name__c}
                        data-field="Registrant_Preferred_First_Name__c"
                        required={preferredNameRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>

            <!-- Last Name as a Student -->
            <template if:true={showLastNameAsStudent}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label={lastNameAsStudentLabel}
                        value={registration.Last_Name_as_Student__c}
                        data-field="Last_Name_as_Student__c"
                        required={lastNameAsStudentRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>

            <!-- Phone -->
            <template if:true={showPhoneSection}>
                <div class="slds-col slds-size_1-of-1">
                    <h3 class="slds-text-heading_medium slds-m-bottom_small">Phone</h3>
                </div>

                <template if:true={phoneRequireOne}>
                    <div class="slds-col slds-size_1-of-1">
                        <p class="slds-is-required"><strong>Please provide either a home or mobile number</strong></p>
                    </div>
                </template>

                <template if:true={showHomePhone}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="tel"
                            label={homePhoneLabel}
                            value={registration.Registrant_Phone__c}
                            data-field="Registrant_Phone__c"
                            required={homePhoneRequired}
                            onchange={handleInputChange}
                            onblur={handlePhoneBlur}>
                        </lightning-input>
                    </div>
                </template>

                <template if:true={showMobilePhone}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="tel"
                            label={mobilePhoneLabel}
                            value={registration.Registrant_Mobile_Phone__c}
                            data-field="Registrant_Mobile_Phone__c"
                            required={mobilePhoneRequired}
                            onchange={handleInputChange}
                            onblur={handlePhoneBlur}>
                        </lightning-input>
                    </div>
                </template>

                <template if:true={showPhoneTypeSelect}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox
                            label={phoneTypeLabel}
                            value={phoneType}
                            options={phoneTypeOptions}
                            required={phoneTypeRequired}
                            onchange={handlePhoneTypeChange}>
                        </lightning-combobox>
                    </div>
                </template>

                <template if:true={showReceiveTexts}>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-input
                            type="checkbox"
                            label={receiveTextsLabel}
                            checked={registration.Registrant_Receive_Texts__c}
                            data-field="Registrant_Receive_Texts__c"
                            onchange={handleCheckboxChange}>
                        </lightning-input>
                    </div>
                </template>
            </template>

            <!-- Gender -->
            <template if:true={showGender}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label={genderLabel}
                        value={registration.Registrant_Gender__c}
                        options={genderOptions}
                        data-field="Registrant_Gender__c"
                        required={genderRequired}
                        onchange={handleInputChange}>
                    </lightning-combobox>
                </div>
            </template>

            <!-- Pronouns -->
            <template if:true={showPronoun}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label={pronounsLabel}
                        value={registration.Registrant_Pronouns__c}
                        options={pronounOptions}
                        data-field="Registrant_Pronouns__c"
                        required={pronounRequired}
                        onchange={handleInputChange}>
                    </lightning-combobox>
                </div>
            </template>

            <!-- Title -->
            <template if:true={showTitle}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label={titleLabel}
                        value={registration.Registrant_Title__c}
                        data-field="Registrant_Title__c"
                        required={titleRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>

            <!-- Company/Organization -->
            <template if:true={showCompanyOrganization}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label={companyOrganizationLabel}
                        value={registration.Registrant_Company_Organization__c}
                        data-field="Registrant_Company_Organization__c"
                        required={companyOrganizationRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>

            <!-- Applicant Type -->
            <template if:true={showApplicantType}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Applicant Type"
                        value={registration.Registrant_Applicant_Type__c}
                        options={applicantTypeOptions}
                        data-field="Registrant_Applicant_Type__c"
                        required={applicantTypeRequired}
                        onchange={handleInputChange}>
                    </lightning-combobox>
                </div>
            </template>

            <!-- Preferred Class Year -->
            <template if:true={showPreferredClassYear}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="text"
                        label="Preferred Class Year"
                        value={registration.Preferred_Class_Year__c}
                        data-field="Preferred_Class_Year__c"
                        pattern="(19|20)[0-9]{2}"
                        max-length="4"
                        message-when-pattern-mismatch="Enter a 4-digit year between 1900 and 2099."
                        required={preferredClassYearRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>

            <!-- Date of Birth -->
            <template if:true={showDateOfBirth}>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="date"
                        label={dateOfBirthLabel}
                        value={registration.Registrant_Date_of_Birth__c}
                        data-field="Registrant_Date_of_Birth__c"
                        required={dateOfBirthRequired}
                        onchange={handleInputChange}>
                    </lightning-input>
                </div>
            </template>
        </div>

        <!-- Relationship to the Institution -->
        <template if:true={showRelationshipToInstitution}>
            <div class="slds-m-top_medium">
                <fieldset class={relationshipErrorClass}>
                    <legend class="slds-form-element__legend slds-form-element__label">
                        Relationship to the Institution
                        <template if:true={relationshipToInstitutionRequired}>
                            <abbr class="slds-required" title="required"> * </abbr>
                        </template>
                    </legend>
                    <div class="slds-form-element__control">
                        <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-top_x-small slds-m-left_xxx-small">
                            <template for:each={relationshipToInstitutionPills} for:item="pill">
                                <div key={pill.value} class="slds-p-bottom_x-small slds-p-right_x-small">
                                    <lightning-button
                                        label={pill.label}
                                        variant={pill.variant}
                                        icon-name={pill.iconName}
                                        icon-position="left"
                                        data-value={pill.value}
                                        onclick={handleRelationshipPillClick}>
                                    </lightning-button>
                                </div>
                            </template>
                        </div>
                        <template if:true={relationshipMissingError}>
                            <p class="slds-form-element__help">Complete this field.</p>
                        </template>
                    </div>
                </fieldset>
            </div>
        </template>

        <!-- Accessibility Needs -->
        <template if:true={showAccessibilityNeeds}>
            <div class="slds-m-top_medium">
                <lightning-combobox
                    label={accessibilityLabel}
                    value={registration.Accessibility_Need__c}
                    options={accessibilityOptions}
                    data-field="Accessibility_Need__c"
                    required={accessibilityNeedsRequired}
                    onchange={handleInputChange}>
                </lightning-combobox>
            </div>
            <template if:true={showAccessibilityDetails}>
                <div class="slds-m-top_medium">
                    <lightning-textarea
                        label={accessibilityDetailLabel}
                        value={registration.Accessibility_Need_Detail__c}
                        data-field="Accessibility_Need_Detail__c"
                        onchange={handleInputChange}>
                    </lightning-textarea>
                </div>
            </template>
        </template>

        <!-- Dietary Restrictions -->
        <template if:true={showDietaryRestrictions}>
            <div class="slds-m-top_medium">
                <lightning-textarea
                    label={dietaryRestrictionsLabel}
                    value={registration.Dietary_Ristrictions__c}
                    data-field="Dietary_Ristrictions__c"
                    required={dietaryRestrictionsRequired}
                    onchange={handleInputChange}>
                </lightning-textarea>
            </div>
        </template>

        <!-- Mailing Address -->
        <template if:true={showMailingAddress}>
            <div class="slds-m-top_medium">
                <lightning-input-address
                    address-label={mailingAddressLabel}
                    show-compact-address
                    street-label="Street"
                    subpremise-label="Street 2"
                    city-label="City"
                    province-label="State/Province"
                    country-label="Country"
                    postal-code-label="Postal Code"
                    street={registration.Registrant_Street_1__c}
                    subpremise={registration.Registrant_Street_2__c}
                    city={registration.Registrant_City__c}
                    province={currentProvinceValue}
                    province-options={stateOptionsForCountry}
                    country={registration.Registrant_Country__c}
                    country-options={countryOptions}
                    postal-code={registration.Registrant_Zip__c}
                    required={mailingAddressRequired}
                    onchange={handleAddressChange}>
                </lightning-input-address>
            </div>
        </template>

        <!-- Additional Information -->
        <template if:true={hasAdditionalInfoSection}>
            <div class="slds-m-top_medium">
                <h3 class="slds-text-heading_medium">Additional Information</h3>
                <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                    <!-- Preferred Visit Time -->
                    <template if:true={includeTimeFrameList}>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox
                                label="Preferred visit time"
                                value={registration.Preferred_Visit_Time__c}
                                options={timeFrameOptions}
                                data-field="Preferred_Visit_Time__c"
                                required
                                onchange={handleInputChange}>
                            </lightning-combobox>
                        </div>
                    </template>

                    <!-- Additional Guests -->
                    <template if:true={allowOtherAttendees}>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox
                                label="Additional guests"
                                value={registration.Number_of_Guests__c}
                                options={guestAmountOptions}
                                data-field="Number_of_Guests__c"
                                onchange={handleInputChange}>
                            </lightning-combobox>
                        </div>
                    </template>

                    <!-- Event-configured free-form questions (up to 5) -->
                    <template for:each={additionalInfoQuestions} for:item="question">
                        <div key={question.questionNumber} class="slds-col slds-size_1-of-1">
                            <template if:true={question.isTextBox}>
                                <lightning-input
                                    label={question.questionText}
                                    value={question.currentValue}
                                    data-field={question.mapToField}
                                    required={question.required}
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </template>
                            <template if:true={question.isTextArea}>
                                <lightning-textarea
                                    label={question.questionText}
                                    value={question.currentValue}
                                    data-field={question.mapToField}
                                    required={question.required}
                                    onchange={handleInputChange}>
                                </lightning-textarea>
                            </template>
                            <template if:true={question.isPicklist}>
                                <lightning-combobox
                                    label={question.questionText}
                                    value={question.currentValue}
                                    options={question.picklistOptions}
                                    data-field={question.mapToField}
                                    required={question.required}
                                    onchange={handleInputChange}>
                                </lightning-combobox>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
